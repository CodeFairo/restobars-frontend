<mat-card>
  <mat-card-title>Solicitudes de Meseros</mat-card-title>
  <mat-card-content>
    <div *ngIf="loading">Cargando solicitudes...</div>
    <table mat-table [dataSource]="solicitudes" class="mat-elevation-z2 full-width" *ngIf="!loading && solicitudes.length">

      <!-- Usuario -->
      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef>Mesero</th>
        <td mat-cell *matCellDef="let solicitud">
          {{ solicitud.user?.nombre }} {{ solicitud.user?.apellido }}
        </td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let solicitud">{{ solicitud.estado }}</td>
      </ng-container>

      <!-- Fecha -->
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let solicitud">{{ solicitud.fechaSolicitud | date:'short' }}</td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let solicitud">
          <button mat-icon-button color="primary" (click)="cambiarEstado(solicitud.id, 'ACEPTADO')" [disabled]="solicitud.estado === 'ACEPTADO'" title="Aceptar">
            <mat-icon>check</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="cambiarEstado(solicitud.id, 'RECHAZADO')" [disabled]="solicitud.estado === 'RECHAZADO'" title="Rechazar">
            <mat-icon>close</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="eliminarSolicitud(solicitud.id)" title="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['usuario', 'estado', 'fecha', 'acciones']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['usuario', 'estado', 'fecha', 'acciones'];"></tr>
    </table>

    <div *ngIf="!loading && solicitudes.length === 0">
      No hay solicitudes pendientes.
    </div>
  </mat-card-content>
</mat-card>
