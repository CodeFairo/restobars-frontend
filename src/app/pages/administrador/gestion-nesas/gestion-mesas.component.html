<div class="background-blur"></div>
<div class="background-overlay"></div>
<div class="card-container">

  <mat-card>
    <mat-card-title>Gestión de Mesas</mat-card-title>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Selecciona un restaurante</mat-label>
      <mat-select [(ngModel)]="selectedRestobarId" (selectionChange)="onRestobarSelected()">
        <mat-option *ngFor="let r of misRestobars" [value]="r.id">{{ r.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <div *ngIf="selectedRestobarId">
      <form (ngSubmit)="agregarMesa()" #mesaForm="ngForm" class="mesa-form">
        <mat-form-field appearance="outline">
          <mat-label>Capacidad</mat-label>
          <input matInput type="number" [(ngModel)]="nuevaCapacidad" name="capacidad" required min="1">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="!mesaForm.form.valid">
          Agregar Mesa
        </button>
      </form>

      <div class="mesa-lista">
        <mat-card *ngFor="let mesa of mesas; let i = index" class="mesa-item"
          [ngStyle]="{ 'background-color': mesaColores[i] }">
          <div>
            <strong>Mesa {{ mesa.numero }}</strong><br />
            Capacidad: {{ mesa.capacidad }}
          </div>
          <button mat-icon-button color="warn" (click)="eliminarMesa(i)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-card>
      </div>

      <div class="acciones-footer">
        <button mat-raised-button color="accent" (click)="guardarCambios()">
          Guardar Cambios
        </button>

        <button mat-stroked-button color="warn" (click)="eliminarTodasMesas()">
          Eliminar Todas las Mesas
        </button>
      </div>
    </div>
  </mat-card>
</div>
